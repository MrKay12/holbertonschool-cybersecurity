# NovaTech Hardened Shield - Nginx, run entirely as appuser (no root process)
worker_processes auto;
pid /run/nginx/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Information disclosure
    server_tokens off;

    # Timeouts and buffer limits (slowloris / oversized requests)
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 15;
    client_body_timeout 10;
    client_header_timeout 10;
    send_timeout 10;
    client_max_body_size 1m;
    client_body_buffer_size 16k;
    large_client_header_buffers 4 8k;

    # Writable paths owned by appuser (tmpfs-friendly)
    client_body_temp_path /var/lib/nginx/body;
    proxy_temp_path       /var/lib/nginx/proxy;
    fastcgi_temp_path     /var/lib/nginx/fastcgi;
    uwsgi_temp_path       /var/lib/nginx/uwsgi;
    scgi_temp_path        /var/lib/nginx/scgi;

    access_log /var/log/nginx/access.log;

    # Rate limiting (needs nginx-core: nginx-light lacks these modules)
    limit_req_zone  $binary_remote_addr zone=perip:10m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=connperip:10m;
    limit_req_status  429;
    limit_conn_status 429;

    server {
        listen 8080 default_server;
        server_name _;
        root /var/www/html;
        index index.html;
        autoindex off;

        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'; base-uri 'none'" always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;

        limit_req  zone=perip burst=20 nodelay;
        limit_conn connperip 20;

        location = /health {
            access_log off;
            default_type text/plain;
            return 200 "OK\n";
        }

        # Dotfiles (.git, .env, .htpasswd ...)
        location ~ /\. {
            deny all;
            return 404;
        }

        location / {
            limit_except GET HEAD {
                deny all;
            }
            try_files $uri $uri/ =404;
        }
    }
}
